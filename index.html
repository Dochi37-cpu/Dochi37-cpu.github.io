   <article class="ip-family"><div class="domain">Energy & Functional Systems</div><h3>Emulsion Spectral Fluid Filter</h3><p><span class="lang-ko">태양전지에 유효한 파장대는 통과시키고 열부하를 만드는 파장대는 흡수·회수하도록 설계한 유체형 스펙트럼 필터.</span><span class="lang-en">Fluidic spectral filter designed to transmit photovoltaic-effective wavelengths while absorbing and recovering thermal-load wavelengths.</span></p><div class="ip-chain"><span class="ip-node">KR 10-2660816</span><span class="ip-arrow">→</span><span class="ip-node">WO 2023/075066</span><span class="ip-arrow">→</span><span class="ip-node">US 2025/0113656 A1</span></div><div class="ip-status"><span class="ip-badge">KR GRANTED</span><span class="ip-badge pub">US PUBLISHED</span></div><div class="ip-related"><b>Related publication:</b> Energy Conversion and Management 287 (2023) 117087 · <a class="source-link" href="https://doi.org/10.1016/j.enconman.2023.117087" target="_blank">DOI ↗</a></div></article>
   <article class="ip-family"><div class="domain">Hydrogen & Electrolysis · Technology Cluster</div><h3>Seawater Electrolysis Catalysts & Electrodes</h3><p><span class="lang-ko">Ni–V, Ni–Mo, Co–V 및 NiFeCo 계열의 해수 수전해 촉매·전극·제조법 관련 복수 출원을 포함합니다. 이 영역은 하나의 patent family가 아니라 다수의 독립 출원이 이어지는 기술 cluster로 표시합니다.</span><span class="lang-en">Multiple filings cover Ni–V, Ni–Mo, Co–V and NiFeCo catalyst/electrode concepts and manufacturing routes for saline/seawater electrolysis. They are presented as a technology cluster, not a single patent family.</span></p><div class="ip-chain"><span class="ip-node">KR priority 10-2024-0106853</span><span class="ip-arrow">→</span><span class="ip-node">KR 10-2025-0097517</span><span class="ip-arrow">→</span><span class="ip-node">KR 10-2026-0023453 A</span></div><div class="ip-status"><span class="ip-badge pub">KR PUBLISHED</span><span class="ip-badge pub">MULTIPLE RELATED FILINGS</span></div><div class="ip-related"><b>Related publication:</b> Advanced Functional Materials 36 (2026) e16387 · <a class="source-link" href="https://doi.org/10.1002/adfm.202516387" target="_blank">DOI ↗</a></div></article>
