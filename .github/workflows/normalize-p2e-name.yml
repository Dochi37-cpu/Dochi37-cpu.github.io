name: Normalize P2E Research Group naming
on:
  push:
    branches: [p2e-rebrand-publications]
    paths: [.github/workflows/normalize-p2e-name.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2e-rebrand-publications
      - name: Normalize naming
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts or p.suffix.lower() not in {'.html','.md','.txt','.json','.xml','.js'}: continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('P2E Systems Group','P2E Research Group').replace('an P2E-originated','a P2E-originated')
              p.write_text(s,encoding='utf-8')
          PY
          python tools/validate_site.py
          node --check assets/site.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize P2E Research Group naming"
          git push origin HEAD:p2e-rebrand-publications
