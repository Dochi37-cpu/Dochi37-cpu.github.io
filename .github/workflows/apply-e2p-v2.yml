name: Apply E2P v2 QA final

on:
  push:
    branches: [deploy-v2-plant-bop]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-v2-plant-bop
      - name: Apply remaining final files
        shell: bash
        run: |
          cat .deploy/three.b64.* > /tmp/three.b64
          base64 -d /tmp/three.b64 > /tmp/three.zip
          unzip -oq /tmp/three.zip -d .
          rm -rf .deploy
          rm -f .github/workflows/apply-e2p-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply remaining E2P v2 QA-final files"
            git push origin HEAD:deploy-v2-plant-bop
          fi
